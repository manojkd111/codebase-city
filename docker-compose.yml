services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: city
      POSTGRES_DB: city
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:  # used from Week 4 (event bus across worker processes, arq job queue)
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:

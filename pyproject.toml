[project]
name = "codebase-city"
version = "0.1.0"
description = "Turn a GitHub repo into a 3D city; Claude agents find and fix real problems."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "lizard>=1.17",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "anthropic>=2.5",
    "mcp>=2.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
workers = ["redis>=5", "arq>=0.26"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fakeredis>=2.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Deliberately flawed code the agents are benchmarked against; linting it would "fix" the answers.
extend-exclude = ["evals/benchmark/planted"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
